name: Capstone Project
prefect-version: 3.8.6

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/Aakash-1107/Game-Market-Intelligence.git
      branch: main

  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ clone-step.directory }}"
      requirements_file: requirements.txt

deployments:
- name: hourly-steam-ingestion
  version: null
  tags: []
  concurrency_limit: null
  description: null
  entrypoint: First_data_ingest/steam_data_ingest.py:steam_player_count_ingest
  parameters: {}
  work_pool:
    name: managed-steam-pool
    work_queue_name: null
    job_variables:
      env:
        DATABASE_URL:   "{{ prefect.blocks.secret.neon-database-url }}"
        AWS_ACCESS_KEY: "{{ prefect.blocks.secret.aws-access-key }}"
        AWS_SECRET_KEY: "{{ prefect.blocks.secret.aws-secret-key }}"
        AWS_REGION:     "{{ prefect.blocks.secret.aws-region }}"
        AWS_BUCKET:     "{{ prefect.blocks.secret.aws-bucket }}"
  schedules:
  - cron: 0 * * * *
    timezone: Europe/Berlin
    day_or: true
    active: true