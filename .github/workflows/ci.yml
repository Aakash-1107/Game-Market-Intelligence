name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          

      # Uses ruff.toml (full default rule set + E402, E712)
      - name: Lint
        run: ruff check --output-format=github .

      - name: dbt deps
        working-directory: game_market
        run: dbt deps

      - name: dbt parse
        working-directory: game_market
        env:
          # Dummy values: parse resolves env_var() but never connects
          AWS_ACCESS_KEY: dummy
          AWS_SECRET_KEY: dummy
          AWS_REGION: eu-central-1
          AWS_BUCKET: dummy
        run: dbt parse --profiles-dir .