version: 2

# One exposure per Streamlit page (dashboard/home.py navigation). The dashboard reads schemas `reporting`
# (rpt_* question models) and `marts` (gold facts and dim_game) only, never staging or intermediate.
# depends_on = tables each page actually queries, including via the shared helpers in
# dashboard/common.py: coverage() -> fact_player_activity, fact_player_activity_daily (5-minute range),
# fact_player_activity_monthly; pipeline_counts() -> also fact_player_activity_daily (5-minute reading count);
# live_snapshot() -> fact_player_activity, fact_player_activity_monthly, dim_game.

exposures:
  - name: dashboard_market_overview
    label: "Dashboard — Market overview"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/0_Overview.py (default page). Headline counts,
      data coverage, live hourly snapshot per game and genre mix.
    owner:
      name: Ash
    depends_on:
      - ref('dim_game')
      - ref('fact_player_activity')
      - ref('fact_player_activity_daily')
      - ref('fact_player_activity_monthly')
      - ref('fact_price_snapshot')
      - ref('fact_reviews')

  - name: dashboard_life_after_launch
    label: "Dashboard — Life after launch (Q1)"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/1_Lifecycle.py. Lifecycle patterns: how player
      counts develop in the months after launch.
    owner:
      name: Ash
    depends_on:
      - ref('rpt_game_lifecycle')
      - ref('rpt_lifecycle_curve')
      - ref('rpt_lifecycle_typical_curve')
      - ref('fact_player_activity_monthly')
      - ref('fact_player_activity')
      - ref('fact_player_activity_daily')

  - name: dashboard_activity_health
    label: "Dashboard — Activity health (Q2)"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/2_Activity_Health.py. Health class per game
      (growing, stable, declining, volatile) from recent monthly activity.
    owner:
      name: Ash
    depends_on:
      - ref('rpt_activity_health')
      - ref('fact_player_activity_monthly')

  - name: dashboard_do_discounts_bring_players
    label: "Dashboard — Do discounts bring players? (Q3)"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/3_Sale_Effect.py showing player activity before,
      during and after Steam discount periods.
    owner:
      name: Ash
    depends_on:
      - ref('rpt_discount_effect')
      - ref('rpt_discount_typical')
      - ref('rpt_discount_by_depth')
      - ref('rpt_discount_effect_daily')
      - ref('dim_game')
      - ref('fact_player_activity')
      - ref('fact_player_activity_daily')
      - ref('fact_player_activity_monthly')

  - name: dashboard_unusual_days
    label: "Dashboard — Unusual days (Q4)"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/4_Market_Events.py. Days with anomalous player
      activity (z-score vs 28-day baseline), flagged against sales and Steam-wide events.
    owner:
      name: Ash
    depends_on:
      - ref('rpt_market_anomalies')
      - ref('rpt_discount_effect')
      - ref('dim_game')
      - ref('fact_player_activity')
      - ref('fact_player_activity_daily')
      - ref('fact_player_activity_monthly')

  - name: dashboard_game_explorer
    label: "Dashboard — Game explorer"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/5_Game_Explorer.py. Per-game drill-down: activity,
      lifecycle and health class, price history, Steam user reviews.
    owner:
      name: Ash
    depends_on:
      - ref('dim_game')
      - ref('rpt_game_lifecycle')
      - ref('rpt_activity_health')
      - ref('fact_player_activity')
      - ref('fact_player_activity_daily')
      - ref('fact_player_activity_monthly')
      - ref('fact_price_snapshot')
      - ref('fact_reviews')

  - name: dashboard_how_the_data_is_built
    label: "Dashboard — How the data is built"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/6_Data.py. Sources, refresh cadence, coverage per source
      and games missing monthly or price data.
    owner:
      name: Ash
    depends_on:
      - ref('dim_game')
      - ref('fact_player_activity')
      - ref('fact_player_activity_daily')
      - ref('fact_player_activity_monthly')
      - ref('fact_price_snapshot')
      - ref('fact_reviews')
      - ref('rpt_discount_effect')
      - ref('rpt_market_anomalies')

  - name: dashboard_pipeline_health
    label: "Dashboard — Pipeline health"
    type: dashboard
    maturity: medium
    description: >
      Streamlit page dashboard/views/7_Pipeline_Health.py. Health per pipeline component (computed at read time),
      daily ingestion completeness per source, and the latest dbt builds of the daily flow. Needs the read-only
      Neon attach (DATABASE_URL).
    tags: ["observability"]
    owner:
      name: Ash
    depends_on:
      - ref('mart_pipeline_health')
      - ref('mart_ingestion_daily')
      - ref('mart_dbt_run_history')
      - ref('mart_pipeline_stage_runs')
