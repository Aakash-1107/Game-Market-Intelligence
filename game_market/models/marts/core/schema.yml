version: 2

models:
  - name: dim_game
    description: "One row per Steam application. Grain: one Steam App ID."
    columns:
      - name: game_key
        description: "MD5 surrogate key generated from steam_app_id"
        tests:
          - not_null
          - unique
      - name: steam_app_id
        description: "Canonical Steam App ID"
        tests:
          - not_null
          - unique
      - name: name
        description: "Application name as returned by Steam"
        tests:
          - not_null
      - name: review_total_positive
        description: "Lifetime positive Steam user reviews (appreviews query_summary, latest fetch). NULL if no review data."
      - name: review_total_negative
        description: "Lifetime negative Steam user reviews (appreviews query_summary, latest fetch). NULL if no review data."
      - name: review_total_count
        description: "Lifetime total Steam user reviews (appreviews query_summary, latest fetch). Distinct from total_recommendations, which comes from appdetails. NULL if no review data."
      - name: review_score
        description: "Steam's review score bucket (1–9) from query_summary. NULL if no review data."
      - name: review_score_desc
        description: "Steam's label for the review score, e.g. 'Very Positive'. NULL if no review data."
      - name: review_positivity_pct
        description: "review_total_positive / review_total_count * 100, rounded to 2 decimals. NULL if no review data."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "review_positivity_pct is not null"   # games without review data are allowed

  - name: fact_player_activity
    description: "One row per game per observation timestamp. Grain: one player count observation for one game at one point in time."
    columns:
      - name: activity_key
        description: "MD5 surrogate key generated from steam_app_id and recorded_at"
        tests:
          - not_null
          - unique
      - name: game_key
        description: "Foreign key to dim_game"
        tests:
          - not_null
          - relationships:
              to: ref('dim_game')
              field: game_key
      - name: steam_app_id
        description: "Steam App ID"
        tests:
          - not_null
      - name: player_count
        description: "Concurrent players at time of observation"
        tests:
          - not_null
      - name: recorded_at
        description: "Timestamp when the player count was fetched"
        tests:
          - not_null
      - name: data_resolution
        description: "Granularity of the observation: hourly, 5min, or monthly"
        tests:
          - not_null
          - accepted_values:
              values: ['hourly', '5min', 'monthly']


  - name: fact_price_snapshot
    description: "One row per price change event per game per shop. Grain: itad_game_id + shop_id + observed_at."
    columns:
      - name: snapshot_id
        description: "Surrogate key: md5(itad_game_id | shop_id | observed_at)"
        data_tests:
          - unique
          - not_null
      - name: game_key
        data_tests:
          - not_null
      - name: steam_app_id
        data_tests:
          - not_null
      - name: shop_id
        data_tests:
          - not_null
      - name: observed_at
        data_tests:
          - not_null
      - name: price_amount
        data_tests:
          - not_null
      - name: discount_pct
        data_tests:
          - not_null
      - name: is_on_sale
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fact_critic_review
    description: "One row per critic review per game. Grain: one outlet review of one game at one published date."
    columns:
      - name: critic_review_key
        tests:
          - not_null
          - unique
      - name: game_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_game')
              field: game_key
      - name: np_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: published_at
        tests:
          - not_null

  - name: fact_player_activity_monthly
    description: "One row per game per calendar month. SteamCharts scrape preferred; Kaggle fills game-months SteamCharts lacks."
    columns:
      - name: activity_monthly_key
        data_tests:
          - not_null
          - unique
      - name: game_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_key
      - name: steam_app_id
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['steamcharts', 'kaggle']
