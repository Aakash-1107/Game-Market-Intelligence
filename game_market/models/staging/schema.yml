version: 2

models:
  - name: stg_steam__app_list
    description: "Cleaned Steam app catalogue from RustFS CSV"
    columns:
      - name: steam_app_id
        description: "Steam App ID"
        tests:
          - not_null
          - unique
      - name: app_name
        description: "Application name"
        tests:
          - not_null

  - name: stg_steam__player_counts
    description: "Hourly (live) and 5-minute (backfill) player count observations from S3 Parquet. Grain: one row per game per recorded_at; hourly wins over backfill, then latest file."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['steam_app_id', 'recorded_at']
    columns:
      - name: steam_app_id
        description: "Steam App ID"
        tests:
          - not_null
      - name: player_count
        description: "Concurrent players — nulls already filtered in staging"
        tests:
          - not_null
      - name: recorded_at
        description: "Observation timestamp"
        tests:
          - not_null

  - name: stg_opencritic__reviews
    description: "Critic reviews from OpenCritic via RapidAPI, English only, scored reviews only. Grain: one row per review_id, latest fetch wins."
    columns:
      - name: review_id
        tests:
          - not_null
          - unique
      - name: steam_app_id
        tests:
          - not_null
      - name: published_at
        tests:
          - not_null
      - name: np_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: outlet_id
        tests:
          - not_null

  - name: stg_steamcharts__monthly
    description: "SteamCharts monthly table per game (scraped 2026-09-24). Grain: one game per calendar month, latest fetch wins."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['steam_app_id', 'activity_month']
    columns:
      - name: steam_app_id
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null

  - name: stg_steam__app_details
    description: "Steam appdetails per game. Grain: one row per game, latest fetch wins."
    columns:
      - name: steam_app_id
        data_tests:
          - not_null
          - unique

  - name: stg_steam__reviews
    description: "Individual Steam user reviews (sample of up to 1,000 per game per fetch). Grain: one row per (steam_app_id, recommendation_id); latest fetch wins, and repeats across result pages within a fetch are collapsed."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['steam_app_id', 'recommendation_id']
    columns:
      - name: recommendation_id
        data_tests:
          - not_null

  - name: stg_steam__reviews_summary
    description: "Lifetime Steam review totals per game. Grain: one row per game, latest fetch wins."
    columns:
      - name: steam_app_id
        data_tests:
          - not_null
          - unique

  - name: stg_itad__price_history
    description: "ITAD price-change events per game and shop. Grain: one row per (itad_game_id, shop_id, observed_at); latest fetch wins, same-instant conflicts resolved deterministically."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['itad_game_id', 'shop_id', 'observed_at']

  - name: stg_kaggle__steamcharts_monthly
    description: "Static Kaggle SteamCharts snapshot (ends 2025-09). Grain: one row per game per month; the file is static, so there is nothing to deduplicate, only a test."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['steam_app_id', 'activity_month']
