version: 2

models:
  - name: stg_steam__app_list
    description: "Cleaned Steam app catalogue from RustFS CSV"
    columns:
      - name: steam_app_id
        description: "Steam App ID"
        tests:
          - not_null
          - unique
      - name: app_name
        description: "Application name"
        tests:
          - not_null

  - name: stg_steam__player_counts
    description: "Cleaned hourly player count observations from RustFS Parquet"
    columns:
      - name: steam_app_id
        description: "Steam App ID"
        tests:
          - not_null
      - name: player_count
        description: "Concurrent players — nulls already filtered in staging"
        tests:
          - not_null
      - name: recorded_at
        description: "Observation timestamp"
        tests:
          - not_null

  - name: stg_opencritic__reviews
    description: "Critic reviews from OpenCritic via RapidAPI, English only, scored reviews only"
    columns:
      - name: review_id
        tests:
          - not_null
          - unique
      - name: steam_app_id
        tests:
          - not_null
      - name: published_at
        tests:
          - not_null
      - name: np_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: outlet_id
        tests:
          - not_null

  - name: stg_steamcharts__monthly
    description: "SteamCharts monthly table per game (scraped 2026-09-24). Grain: one game per calendar month, latest fetch wins."
    columns:
      - name: steam_app_id
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
