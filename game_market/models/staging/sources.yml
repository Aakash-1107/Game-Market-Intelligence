version: 2

sources:
  - name: steam_raw
    description: "Raw Steam data stored in RustFS object storage"
    # DELETE the meta block below — it overrides the table-level external locations
    tables:
      - name: player_counts
        description: "Hourly concurrent player counts per game, ingested via Prefect"
        external:
          location: "s3://game-market-raw/raw/steam/player_counts/**/*.parquet"
          format: parquet
        columns:
          - name: id
            description: "Row ID from Neon — not meaningful in the analytical layer"
          - name: recorded_at
            description: "Timestamp when the player count was fetched"
          - name: appid
            description: "Steam App ID — canonical game identifier"
          - name: game_name
            description: "Game name as defined in the ingestion GAMES dictionary"
          - name: player_count
            description: "Concurrent players at time of observation. NULL means Steam returned no value."

      - name: app_list
        description: "Full Steam app catalogue — appid and name for all Steam applications"
        external:
          location: "s3://game-market-raw/raw/steam/app_list/steam_app_list.csv"
          format: csv
        columns:
          - name: appid
            description: "Steam App ID"
          - name: name
            description: "Application name as returned by Steam"
          
      - name: app_details
        description: "Raw Steam appdetails JSON, one file per game per ingestion run"
        columns:
          - name: steam_app_id
            description: "Steam App ID — matches game_source_mapping"
          - name: fetched_at_utc
            description: "UTC timestamp when the file was written"
          - name: data
            description: "Full appdetails payload from Steam Store API"
        tests:
          - not_null:
              column_name: steam_app_id
      
  - name: itad_raw
    description: "Raw ITAD price history JSON files from S3"
    tables:
      - name: price_history
        description: "One file per game per ingestion run containing full price history across all shops"
        meta:
          external_location: "s3://game-market-raw/raw/itad/price_history/*/*/*/*_*.json"

  - name: opencritic_raw
    schema: main
    tables:
      - name: reviews
        description: "Raw OpenCritic critic reviews, one file per game per run"
        meta:
          s3_path: "s3://game-market-raw/raw/opencritic/reviews/*/*/*/*.json"
        columns:
          - name: steam_app_id
            tests:
              - not_null