version: 2

sources:
  - name: steam_raw
    description: "Raw Steam data stored in AWS S3"
    tables:
      - name: player_counts
        description: "Hourly concurrent player counts per game, written by src/ingestion/steam_player_counts.py"
        meta:
          external_location: "read_parquet('s3://{{ env_var('AWS_BUCKET') }}/raw/steam/player_counts/[0-9][0-9][0-9][0-9]/**/*.parquet')"
        columns:
          - name: id
            description: "Row ID from Neon — not meaningful in the analytical layer"
          - name: recorded_at
            description: "Timestamp when the player count was fetched"
          - name: appid
            description: "Steam App ID — canonical game identifier"
          - name: game_name
            description: "Game name as defined in the ingestion GAMES dictionary"
          - name: player_count
            description: "Concurrent players at time of observation. NULL means Steam returned no value."

      - name: app_list
        description: "Full Steam app catalogue — appid and name for all Steam applications"
        meta:
          external_location: "read_csv_auto('s3://{{ env_var('AWS_BUCKET') }}/raw/steam/app_list/steam_app_list.csv')"
        columns:
          - name: appid
            description: "Steam App ID"
          - name: name
            description: "Application name as returned by Steam"
          
      - name: app_details
        description: >
          Raw Steam appdetails JSON, one file per game per ingestion run. Read with explicit columns, so DuckDB
          does no schema inference: inferring the full nested Steam response across all files ran out of memory
          (2026-10-01, 286 files / 8.7 MB, "Allocation failure" at bind time; a memory_limit didn't help).
          `data` stays JSON and staging extracts the fields. struct_pack instead of a {...} literal because
          dbt-duckdb formats external_location with str.format_map (see price_history).
        meta:
          external_location: "read_json('s3://{{ env_var('AWS_BUCKET') }}/raw/steam/app_details/*/*/*/app_details_*.json', columns = struct_pack(steam_app_id := 'BIGINT', fetched_at_utc := 'TIMESTAMP', data := 'JSON'), filename = true)"
        columns:
          - name: steam_app_id
            description: "Steam App ID"
          - name: fetched_at_utc
            description: "UTC timestamp when the file was written"
          - name: data
            description: "Full appdetails payload from Steam Store API"
        tests:
          - not_null:
              column_name: steam_app_id

      - name: reviews
        description: "Raw Steam appreviews JSON, one file per game per ingestion run. Each file holds a query_summary (lifetime totals) and a reviews array (sampled individual reviews)."
        meta:
          external_location: "read_json('s3://{{ env_var('AWS_BUCKET') }}/raw/steam/reviews/*/*/*/*reviews_*.json', format = 'auto')"
        columns:
          - name: steam_app_id
            description: "Steam App ID"
          - name: fetched_at
            description: "Timestamp when the file was fetched"
          - name: query_summary
            description: "Lifetime review totals for the game — used by stg_steam__reviews_summary"
          - name: reviews
            description: "Array of individual reviews — unnested in stg_steam__reviews"

      - name: reviews_summary
        description: >
          The same raw review files as `reviews`, read with explicit columns and without the reviews array,
          for stg_steam__reviews_summary (latest file per game only). No schema inference, and the large
          reviews array is never parsed.
        meta:
          external_location: "read_json('s3://{{ env_var('AWS_BUCKET') }}/raw/steam/reviews/*/*/*/*reviews_*.json', columns = struct_pack(steam_app_id := 'BIGINT', fetched_at := 'TIMESTAMP', query_summary := 'JSON'), filename = true)"

  - name: itad_raw
    description: "Raw ITAD price history JSON files from S3"
    tables:
      - name: price_history
        description: >
          One file per game per ingestion run containing full price history across all shops.
          maximum_depth = 1 keeps `records` as raw JSON (not auto-typed): auto-detection turns the
          offset-carrying timestamps ("2026-09-14T10:16:44+02:00") into zone-less TIMESTAMPs, which
          invites double conversion. Staging extracts each field and casts the timestamp text to
          TIMESTAMPTZ itself. (A `columns = {...}` argument can't be used here: dbt-duckdb formats
          external_location with str.format_map, so curly braces break it.)
        meta:
          external_location: "read_json('s3://{{ env_var('AWS_BUCKET') }}/raw/itad/price_history/*/*/*/*_*.json', format = 'auto', maximum_depth = 1)"

  - name: opencritic_raw
    tables:
      - name: reviews
        description: "Raw OpenCritic critic reviews, one file per game per run"
        meta:
          external_location: "read_json('s3://{{ env_var('AWS_BUCKET') }}/raw/opencritic/reviews/*/*/*/*.json', format = 'auto', union_by_name = true)"
        columns:
          - name: steam_app_id
            tests:
              - not_null


  - name: kaggle_raw
    description: "Static third-party dataset from Kaggle — not re-fetchable on a schedule"
    tables:
      - name: steamcharts_monthly
        description: "Monthly avg/peak player counts, 6,729 games, Aug 2012–Sept 2025 (CC0, Victor Laputsky)"
        meta:
          external_location: "read_csv('s3://{{ env_var('AWS_BUCKET') }}/raw/kaggle/steamcharts_monthly_players/steamcharts.csv', all_varchar=true, header=true)"
          
        columns:
          - name: steam_appid
            description: "Steam App ID as string — cast to bigint in staging"
          - name: month
            description: "Text month-year like 'Sep-25' — parsed to date in staging"

  - name: steamcharts_raw
    tables:
      - name: monthly
        meta:
          external_location: "read_parquet('s3://{{ env_var('AWS_BUCKET') }}/raw/steamcharts/monthly/*/*/*/*.parquet', union_by_name = true)"

  - name: mappings_raw
    description: "Machine-resolved source IDs, written by src/ingestion/resolve_ids.py at the start of every daily run"
    tables:
      - name: itad_mapping
        description: >
          One snapshot file per resolution run: resolved_at_utc plus a mappings array
          (steam_app_id, itad_game_id, status, …). Status is matched_auto, matched_manual, matched_imported, no_coverage,
          not_found or error. Manual overrides are already applied by the resolver.
        meta:
          external_location: "read_json('s3://{{ env_var('AWS_BUCKET') }}/raw/mappings/itad/*/*/*/itad_mapping_*.json', format = 'auto')"
