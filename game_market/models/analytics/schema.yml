version: 2

models:
  - name: an_game_lifecycle
    description: >
      Q1 lifecycle metrics. One row per game in dim_game. Metrics populated only when
      lifecycle_status = 'launch_observed'. month_index 0 = release month.
      Retention and recovery are relative to the launch peak (months 0-3).
    columns:
      - name: game_key
        data_tests:
          - unique
          - not_null
      - name: lifecycle_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['launch_observed', 'launch_not_observed', 'no_monthly_data',
                         'no_release_date', 'released_after_coverage']
      - name: steam_release_context
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['original_launch', 'later_steam_release', 'rerelease']
      - name: launch_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['fresh_launch', 'pre_release_base']
      - name: lifecycle_pattern
        data_tests:
          - accepted_values:
              arguments:
                values: ['front_loaded', 'gradual_decline', 'sustained', 'growing',
                         'insufficient_history']
      - name: retention_m12
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lowest_vs_launch_peak
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: an_activity_health
    description: "Q2 activity health. One row per game. 12-month window ending at the latest monthly data."
    columns:
      - name: game_key
        data_tests:
          - unique
          - not_null
      - name: health_class
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['declining', 'growing', 'stable', 'volatile', 'too_recent', 'insufficient_history', 'no_monthly_data']
      - name: size_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['small', 'medium', 'large', 'very_large']
      - name: months_in_window
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12

  - name: an_sale_effect
    description: "Q3 sale effect. One row per Steam sale episode. Activity from 5-minute backfill (Dec 2017-Aug 2020) only. Observational associations, not causal effects."
    columns:
      - name: sale_episode_key
        data_tests:
          - unique
          - not_null
      - name: episode_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['valid', 'no_activity_data', 'baseline_contaminated', 'insufficient_baseline', 'insufficient_during', 'insufficient_post']
      - name: sale_outcome
        data_tests:
          - accepted_values:
              arguments:
                values: ['no_lift', 'returned_to_baseline', 'elevated_after', 'below_baseline_after']
  - name: an_market_anomalies
    description: "Q4 anomalies. One row per game-day, 21-game 5-min backfill scope (Dec 2017-Aug 2020). z-score vs trailing 28-day baseline."
    columns:
      - name: anomaly_key
        data_tests:
          - unique
          - not_null
      - name: anomaly_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scored', 'insufficient_baseline']
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ['spike', 'drop']
