version: 2

models:
  - name: game_trajectory_monthly
    description: >
      Core 3 — current trajectory. One row per tracked game per month (post-1.0 only),
      with trailing-12-month trend, volatility, distance from peak and a status label.
    columns:
      - name: trajectory_key
        tests:
          - unique
          - not_null
      - name: steam_app_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_game')
              field: steam_app_id
      - name: activity_month
        tests:
          - not_null
      - name: trajectory_status
        tests:
          - not_null
          - accepted_values:
              values: ['launch_phase', 'insufficient_data', 'growing', 'stable', 'slow_decline', 'steep_decline']
      - name: pct_of_peak_to_date
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1