version: 2

models:
  - name: rpt_game_lifecycle
    description: >
      Q1 lifecycle metrics. One row per game in dim_game. Metrics populated only when
      lifecycle_status = 'launch_observed'. month_index 0 = release month.
      Retention and recovery are relative to the launch peak (months 0-3).
    columns:
      - name: game_key
        data_tests:
          - unique
          - not_null
      - name: lifecycle_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['launch_observed', 'launch_not_observed', 'no_monthly_data',
                         'no_release_date', 'released_after_coverage']
      - name: steam_release_context
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['original_launch', 'later_steam_release', 'rerelease']
      - name: launch_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['fresh_launch', 'pre_release_base']
      - name: lifecycle_pattern
        data_tests:
          - accepted_values:
              arguments:
                values: ['front_loaded', 'gradual_decline', 'sustained', 'growing',
                         'insufficient_history']
      - name: retention_m12
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lowest_vs_launch_peak
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lowest_after_launch_players
        description: "Absolute players in the lowest month after the launch peak month (lowest_vs_launch_peak = this / launch_peak_avg)."

  - name: rpt_activity_health
    description: "Q2 activity health. One row per game. 12-month window ending at the latest monthly data."
    columns:
      - name: game_key
        data_tests:
          - unique
          - not_null
      - name: health_class
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['declining', 'growing', 'stable', 'volatile', 'too_recent', 'insufficient_history', 'no_monthly_data']
      - name: size_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['small', 'medium', 'large', 'very_large']
      - name: months_in_window
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12

  - name: rpt_discount_effect
    description: "\"Sale\" here means a Steam discount period (price promotion), not units sold. Q3 sale effect. One row per Steam sale episode. Activity from 5-minute backfill (Dec 2017-Aug 2020) only. Observational associations, not causal effects."
    columns:
      - name: sale_start
        description: "\"Sale\" = Steam discount period (price promotion), not units sold. First day of the discount episode."
      - name: sale_episode_key
        data_tests:
          - unique
          - not_null
      - name: episode_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['valid', 'no_activity_data', 'baseline_contaminated', 'insufficient_baseline', 'insufficient_during', 'insufficient_post']
      - name: sale_outcome
        data_tests:
          - accepted_values:
              arguments:
                values: ['no_lift', 'returned_to_baseline', 'elevated_after', 'below_baseline_after']
  - name: rpt_market_anomalies
    description: "Q4 anomalies. One row per game per UTC day with complete 5-minute backfill data (Dec 2017-Aug 2020). z-score of ln(players) vs the previous 28 days."
    columns:
      - name: anomaly_key
        data_tests:
          - unique
          - not_null
      - name: anomaly_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scored', 'insufficient_baseline']
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ['spike', 'drop']
      - name: games_flagged_same_day
        description: "For anomaly rows: how many games had an anomaly in the same direction that day (including this one)."
      - name: is_market_wide
        description: "Anomaly shared by >=3 games in the same direction that day — likely a platform-wide cause (e.g. Steam outage), not game-specific."
        data_tests:
          - not_null
      - name: sale_discount_pct
        description: "\"Sale\" = Steam discount period (price promotion), not units sold. Max discount of the Steam sale episode covering this day; null when not on sale."
      - name: sale_start
        description: "\"Sale\" = Steam discount period (price promotion), not units sold. First day of the sale episode covering this day; null when not on sale."
      - name: avg_players
        description: "Actual average players that UTC day (complete 5-minute day)."
      - name: baseline_log_mean
        description: "Mean of ln(avg_players) over the previous 28 days (the day itself excluded); the z-score baseline."
      - name: baseline_log_stddev
        description: "Sample standard deviation of ln(avg_players) over the same 28 days."
      - name: baseline_players
        description: "exp(baseline_log_mean): the baseline in players (geometric mean of the 28 days). Null unless scored."
      - name: band_lower_players
        description: "exp(baseline_log_mean - 3 * baseline_log_stddev). A day below it is flagged as a drop. Null unless scored."
      - name: band_upper_players
        description: "exp(baseline_log_mean + 3 * baseline_log_stddev). A day above it is flagged as a surge. Null unless scored."

  - name: rpt_lifecycle_curve
    description: "Q1 curves. One row per launch-observed game per month since release (0-24). vs_launch_peak = avg_players / launch_peak_avg (100% = busiest month in months 0-3)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [steam_app_id, month_index]
    columns:
      - name: vs_launch_peak
        data_tests:
          - not_null

  - name: rpt_lifecycle_typical_curve
    description: "Q1 typical game. One row per month since release (0-24): median of vs_launch_peak across settled games (>= 1 year of history) and how many games that month has."
    columns:
      - name: month_index
        data_tests:
          - unique
          - not_null
      - name: n_games
        data_tests:
          - not_null

  - name: rpt_discount_typical
    description: "Q3 typical discount. One row per discount group (all / 75_or_more / under_50) per phase. Median lift pooled across clean discounts; 100% = the 14 days before each discount."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [discount_group, phase]
    columns:
      - name: phase
        data_tests:
          - accepted_values:
              arguments:
                values: ['before', 'during', 'first_week_after', 'weeks_2_4_after']

  - name: rpt_discount_effect_daily
    description: "Q3 game detail. One row per valid discount episode per complete 5-minute UTC day in its window (14 days before to 28 days after). vs_baseline = avg_players / the episode's baseline_avg."
    columns:
      - name: episode_day_key
        data_tests:
          - unique
          - not_null
      - name: phase
        data_tests:
          - accepted_values:
              arguments:
                values: ['before', 'during', 'first_week_after', 'weeks_2_4_after']
