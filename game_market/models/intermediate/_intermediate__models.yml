version: 2

models:
  - name: int_tracked_games
    description: >
      One row per game in scope: tracked_games seed rows (active and inactive) that also have Steam appdetails.
      The single definition of the tracked-games restriction; dim_game and every intermediate model inner-join it.
    columns:
      - name: steam_app_id
        data_tests:
          - unique
          - not_null

  - name: int_player_activity_monthly__merged
    description: >
      One row per tracked game per calendar month. SteamCharts scrape wins; Kaggle (static snapshot, ends 2025-09)
      fills only game-months SteamCharts does not provide. fact_player_activity_monthly adds keys on top.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [steam_app_id, activity_month]
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: ['steamcharts', 'kaggle']

  - name: int_price_daily
    description: One row per tracked game per calendar day (UTC) of Steam price, forward-filled between ITAD price events.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [steam_app_id, price_date]
    columns:
      - name: price_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: discount_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: is_on_sale
        description: "\"Sale\" = Steam discount period (price promotion), not units sold. True when the game is discounted on Steam that day."

  - name: int_player_activity_daily
    description: One row per tracked game per calendar day (UTC) of player activity.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [steam_app_id, activity_date]

  - name: int_sale_episodes
    description: "\"Sale\" here means a Steam discount period (price promotion), not units sold. One row per Steam sale episode per game (consecutive is_on_sale days)."
    columns:
      - name: sale_start
        description: "\"Sale\" = Steam discount period (price promotion), not units sold. First day of the discount episode."
      - name: sale_episode_key
        data_tests:
          - unique
          - not_null
      - name: sale_days
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
  - name: int_ops__source_latest_data
    description: "One row per monitored data source: the newest data timestamp in the warehouse (from each staging model's fetch/ingest timestamp), as of the dbt build. Prices: the last successful ITAD fetch in ingestion_log (stg_itad__price_history exposes no fetch timestamp)."
    columns:
      - name: component
        data_tests:
          - unique
          - not_null
