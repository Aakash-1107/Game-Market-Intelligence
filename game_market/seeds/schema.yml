version: 2

seeds:
  - name: tracked_games
    description: >
      Human-curated. Authoritative list of tracked games. Adding one row is the only step needed to track a new game.
      Active rows drive every ingestion script. All rows (active and inactive) drive dim_game, so
      is_active=false stops ingestion without losing history. game_name is a human-readable label only;
      the pipeline never depends on it.
    config:
      column_types:
        steam_app_id: varchar
        game_name: varchar
        is_active: boolean
    columns:
      - name: steam_app_id
        tests:
          - unique
          - not_null
      - name: game_name
        description: "Label only, not used by the pipeline"
        tests:
          - not_null
      - name: is_active
        description: "true = ingest; false = stop ingesting but keep the game and its history in the marts"
        data_tests:
          - not_null

  - name: manual_id_overrides
    description: >
      Human-curated. Source-ID decisions that override automatic resolution: matched_manual (human match) and matched_imported
      (setup-time auto-match imported from Neon on 2026-09-28) give the ID,
      no_coverage means the source has no entry. Read by resolve_ids.py (ITAD), opencritic_reviews.py
      (OpenCritic, the only way a game gets OpenCritic data) and stg_source_id_mapping.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['steam_app_id', 'source']
    config:
      column_types:
        steam_app_id: varchar
        source: varchar
        source_game_id: varchar
        status: varchar
        note: varchar
    columns:
      - name: steam_app_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tracked_games')
                field: steam_app_id
              config:
                severity: warn
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['itad', 'opencritic']
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched_manual', 'matched_imported', 'no_coverage']
      - name: source_game_id
        data_tests:
          - not_null:
              config:
                where: "status in ('matched_manual', 'matched_imported')"

  - name: seed_steam_release_context
    description: "Human-curated. Games whose Steam release is not their original launch. Games not listed are treated as original_launch."
    config:
      column_types:
        steam_app_id: integer
    columns:
      - name: steam_app_id
        data_tests:
          - unique
          - not_null
      - name: steam_release_context
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['later_steam_release', 'rerelease']